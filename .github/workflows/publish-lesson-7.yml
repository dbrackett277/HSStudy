name: Publish Lesson 7 prototype

on:
  push:
    branches:
      - prototype/filled-holy-spirit-lesson-7
    paths:
      - "prototype/lesson-7/**"
      - ".github/workflows/publish-lesson-7.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/lesson-7
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/lesson-7/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/lesson-7/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
